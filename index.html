<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooccoliano_vector toolz</title><style>
:root{font-family:Arial,'Noto Sans TC',sans-serif;color:#e9e9e9;background:#111}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}aside{width:310px;flex:0 0 310px;padding:24px 20px;background:#171717;border-right:1px solid #333;height:100vh;overflow-y:auto}h1{font-size:20px;letter-spacing:-.6px;margin:0 0 4px}header small{color:#888;font-size:11px;letter-spacing:2px}.sub{font-size:12px;color:#aaa;line-height:1.6;margin:12px 0 20px}.section{font-size:10px;font-weight:bold;letter-spacing:2px;color:#888;border-top:1px solid #333;padding-top:16px;margin-top:20px;margin-bottom:12px}label{display:block;font-size:12px;margin:12px 0 5px;color:#c6c6c6}textarea,input[type=text],input[type=number],select{background:#242424;border:1px solid #454545;color:#fff;padding:9px;width:100%;font:inherit;border-radius:4px}textarea{resize:vertical;min-height:65px}.r{display:flex;gap:10px}.r>*{flex:1;min-width:0}input[type=range]{width:100%;accent-color:#f0f0f0;margin:0}.ctrl{margin:11px 0}.ctrl label{display:flex;justify-content:space-between;margin-bottom:3px}.ctrl output{color:#fff;font-variant-numeric:tabular-nums}.buttons{display:flex;flex-wrap:wrap;gap:7px}.buttons button,button{background:#303030;border:1px solid #555;color:white;padding:10px 11px;border-radius:4px;cursor:pointer;font-weight:600;font-size:12px}.buttons button:hover,button:hover{background:#444}button.primary{background:white;color:#111;border-color:white}.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}.check input{accent-color:#eee}.note{color:#858585;font-size:11px;line-height:1.65}.stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:#202020}.topbar{height:53px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #383838;gap:8px;font-size:11px;color:#aaa}.preview{flex:1;display:grid;place-items:center;overflow:hidden;padding:28px}#mount{width:min(100%,900px);box-shadow:0 15px 60px #00 </style></head><body><aside><div class="language-picker"><label for="language" data-i18n="language">介面語言</label><select id="language" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option></select></div><header><h1>Rooccoliano_vector toolz</h1><small>EXPERIMENTAL TYPE LAB — 01</small></header><p class="sub" data-i18n="intro">文字切格 × 位移 × 壓縮 × 旋轉。即時預覽，直接匯出可縮放的 SVG。</p>
<div class="section" data-i18n="source">SOURCE</div><label for="txt" data-i18n="content">文字內容</label><textarea id="txt">A</textarea><div class="r"><div><label data-i18n="mode">排列模式</label><select id="mode"><option value="word" data-i18n="word">Word / 單字</option><option value="sentence" data-i18n="sentence">Sentence / 連續文字</option></select></div><div><label data-i18n="font">字體</label><select id="font"><option value="Arial Black,Arial,sans-serif">Arial Black</option><option value="Impact,sans-serif">Impact</option><option value="Georgia,serif">Georgia</option><option value="Courier New,monospace">Courier New</option><option value="sans-serif">Sans Serif</option><option value="Helvetica Neue,Helvetica,Arial,sans-serif">Helvetica Neue</option><option value="Arial Narrow,Arial,sans-serif">Arial Narrow</option><option value="Trebuchet MS,sans-serif">Trebuchet MS</option><option value="Times New Roman,serif">Times New Roman</option><option value="Baskerville,Georgia,serif">Baskerville</option><option value="Futura,Century Gothic,sans-serif">Futura</option><option value="Noto Sans TC,Microsoft JhengHei,sans-serif">Noto Sans TC</option><option value="Noto Serif TC,PMingLiU,serif">Noto Serif TC</option><option value="monospace">Monospace</option></select></div></div>
<label for="fontupload" data-i18n="upload">匯入自訂字型（TTF / OTF / WOFF / WOFF2）</label><input id="fontupload" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" style="width:100%;font-size:11px"><p class="note" id="fontnotice" data-i18n="fontNotice">字型匯入後會嵌入 SVG；字型文字仍未轉外框。</p><div class="section" data-i18n="transform">GRID TRANSFORMATION</div><div id="controls"></div>
<div class="section" data-i18n="output">OUTPUT</div><div class="r"><div><label data-i18n="width">寬度（px）</label><input id="width" type="number" min="200" max="8000" value="1200"></div><div><label data-i18n="height">高度（px）</label><input id="height" type="number" min="200" max="8000" value="1200"></div></div><div class="check"><input type="checkbox" id="showgrid"><label for="showgrid" style="margin:0" data-i18n="showGrid">顯示格線（預覽及輸出）</label></div><div class="check"><input type="checkbox" id="transparent"><label for="transparent" style="margin:0" data-i18n="transparent">透明背景</label></div><div class="r"><div><label data-i18n="ink">前景色</label><input id="ink" type="color" value="#111111" style="width:100%;height:34px"></div><div><label data-i18n="paper">背景色</label><input id="paper" type="color" value="#ffffff" style="width:100%;height:34px"></div></div><div class="section" data-i18n="export">EXPORT</div><div class="buttons"><button class="primary" id="svg" data-i18n="exportSvg">↓ EXPORT SVG</button><button id="png" data-i18n="exportPng">↓ PNG</button><button id="pdf" data-i18n="exportPdf">↓ PDF</button><button id="pause" data-i18n="pause">Ⅱ PAUSE</button><button id="random" data-i18n="random">↻ RANDOMIZE</button><button id="reset" data-i18n="reset">RESET</button></div></aside>
<div class="stage"><div class="topbar"><span data-i18n="live">LIVE COMPOSITION</span><span id="status">1200 × 1200 · SVG NATIVE</span></div><div class="preview"><div id="mount"></div></div><div class="footer" data-i18n="footer">拖曳左側控制項調整。SVG 中的文字仍需本機字型支援；所有格線、旋轉及裁切本身都是向量。</div></div>
<script>
'use strict';const $=id=>document.getElementById(id);
const I18N={
'zh-Hant':{language:'介面語言',intro:'文字切格 × 位移 × 壓縮 × 旋轉。即時預覽，直接匯出可縮放的 SVG。',source:'來源',content:'文字內容',mode:'排列模式',font:'字體',word:'單字',sentence:'連續文字',upload:'匯入自訂字型（TTF / OTF / WOFF / WOFF2）',fontNotice:'字型匯入後會嵌入 SVG；字型文字仍未轉外框。',loaded:'已載入',embedded:'SVG 內嵌字型；部分字型授權禁止嵌入',custom:'自訂字型',transform:'格線變形',output:'輸出設定',width:'寬度（px）',height:'高度（px）',showGrid:'顯示格線（預覽及輸出）',transparent:'透明背景',ink:'前景色',paper:'背景色',export:'匯出',exportSvg:'↓ 匯出 SVG',exportPng:'↓ 匯出 PNG',exportPdf:'↓ 匯出 PDF',pause:'Ⅱ 暫停',play:'▶ 播放',random:'↻ 隨機變形',reset:'重設',live:'即時預覽',footer:'拖曳左側控制項調整。SVG 中的文字仍需本機字型支援；所有格線、旋轉及裁切本身都是向量。',cells:'格',vector:'向量 SVG',fontError:'請選擇 TTF、OTF、WOFF 或 WOFF2 字型檔',loadError:'字型載入失敗',pngError:'PNG 輸出失敗，請先試 SVG。',popupError:'瀏覽器封鎖了新視窗，請允許彈出視窗後再試。',sliders:['文字尺寸','格線大小','格線位移 X','格線位移 Y','擠壓','Y 軸壓縮','旋轉','隨機動態','速度']},
'zh-Hans':{language:'界面语言',intro:'文字分格 × 位移 × 压缩 × 旋转。实时预览，直接导出可缩放的 SVG。',source:'输入',content:'文字内容',mode:'排列模式',font:'字体',word:'单词',sentence:'连续文字',upload:'导入自定义字体（TTF / OTF / WOFF / WOFF2）',fontNotice:'导入字体后将嵌入 SVG；文字尚未转换为轮廓。',loaded:'已加载',embedded:'SVG 内嵌字体；部分字体授权禁止嵌入',custom:'自定义字体',transform:'网格变形',output:'输出设置',width:'宽度（px）',height:'高度（px）',showGrid:'显示网格（预览及输出）',transparent:'透明背景',ink:'前景色',paper:'背景色',export:'导出',exportSvg:'↓ 导出 SVG',exportPng:'↓ 导出 PNG',exportPdf:'↓ 导出 PDF',pause:'Ⅱ 暂停',play:'▶ 播放',random:'↻ 随机变形',reset:'重置',live:'实时预览',footer:'拖动左侧控件进行调整。SVG 中的文字仍需本机字体支持；网格、旋转及裁剪均为矢量。',cells:'格',vector:'矢量 SVG',fontError:'请选择 TTF、OTF、WOFF 或 WOFF2 字体文件',loadError:'字体加载失败',pngError:'PNG 导出失败，请先尝试 SVG。',popupError:'浏览器阻止了弹出窗口，请允许弹出窗口后重试。',sliders:['文字大小','网格大小','网格位移 X','网格位移 Y','挤压','Y 轴压缩','旋转','随机动态','速度']},
'en':{language:'Interface language',intro:'Type slicing × displacement × compression × rotation. Live preview and scalable SVG export.',source:'SOURCE',content:'Text',mode:'Layout mode',font:'Typeface',word:'Word',sentence:'Continuous text',upload:'Import a font (TTF / OTF / WOFF / WOFF2)',fontNotice:'Imported fonts are embedded in SVG; text is not converted to outlines.',loaded:'Loaded',embedded:'Font embedded in SVG; some font licenses prohibit embedding',custom:'Custom font',transform:'GRID TRANSFORMATION',output:'OUTPUT',width:'Width (px)',height:'Height (px)',showGrid:'Show grid (preview and export)',transparent:'Transparent background',ink:'Foreground',paper:'Background',export:'EXPORT',exportSvg:'↓ EXPORT SVG',exportPng:'↓ EXPORT PNG',exportPdf:'↓ EXPORT PDF',pause:'Ⅱ PAUSE',play:'▶ PLAY',random:'↻ RANDOMIZE',reset:'RESET',live:'LIVE COMPOSITION',footer:'Adjust with the controls on the left. SVG text requires the selected font; clipping, rotation and geometry remain vector.',cells:'CELLS',vector:'VECTOR SVG',fontError:'Select a TTF, OTF, WOFF or WOFF2 font file',loadError:'Font import failed',pngError:'PNG export failed. Try SVG first.',popupError:'Popup blocked. Allow popups and try again.',sliders:['Type Size','Grid Size','Grid Shift X','Grid Shift Y','Squeeze','Compression Y','Rotation','Random Motion','Speed']}}
;
let locale='zh-Hant';const tr=k=>I18N[locale][k];
function translateUI(){const d=I18N[locale];document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(d[k]!==undefined)el.textContent=d[k]});document.querySelectorAll('[data-slider]').forEach((el,i)=>{el.textContent=d.sliders[i]});$('pause').textContent=running?d.pause:d.play;const uploaded=$('fontupload').files?.[0];if(uploaded){$('fontnotice').textContent=`${d.loaded}：${uploaded.name}（${d.embedded}）`;const option=[...$('font').options].find(o=>o.value==='ImportedPatternFont');if(option)option.textContent=d.custom+' · '+uploaded.name;}render()}
$('language').addEventListener('change',e=>{locale=e.target.value;translateUI()});
const defs=[['size','Type Size',20,1100,390,1],['grid','Grid Size',20,240,86,1],['x','Grid Shift X',-160,160,40,1],['y','Grid Shift Y',-160,160,40,1],['squeeze','Squeeze',-80,80,0,1],['compression','Compression Y',0,100,0,1],['rotation','Rotation',0,50,0,1],['motion','Random Motion',0,100,32,1],['speed','Speed',0,5,1,.1]];const vals={};for(const [id,name,min,max,initial,step] of defs){vals[id]=initial;let el=document.createElement('div');el.className='ctrl';el.innerHTML=`<label for="${id}"><span data-slider="${id}">${name}</span><output id="o_${id}">${initial}</output></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${initial}">`;$('controls').append(el);$(id).addEventListener('input',()=>{vals[id]=Number($(id).value);$('o_'+id).textContent=vals[id];render()})}let running=true,phase=0,last=0,renderFrame=0,customFontCSS="";const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const N=x=>Number(x.toFixed(3));
function makeSVG(){let W=Math.max(200,Math.min(8000,Number($('width').value)||1200)),H=Math.max(200,Math.min(8000,Number($('height').value)||1200)),g=vals.grid,cols=Math.ceil(W/g/2)+1,rows=Math.ceil(H/g/2)+1,cx=W/2,cy=H/2;const font=$('font').value,ink=$('ink').value,paper=$('paper').value,txt=$('txt').value||'A';let result=[`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`];if(!$('transparent').checked)result.push(`<rect width="${W}" height="${H}" fill="${paper}"/>`);result.push('<defs>');if(customFontCSS)result.push(`<style><![CDATA[${customFontCSS}]]></style>`);let cells=[];for(let row=-rows;row<=rows;row++){for(let col=-cols;col<=cols;col++){let x=cx+col*g-g/2,y=cy+row*g-g/2;if(x>=W||x+g<=0||y>=H||y+g<=0)continue;let id=`c${row+rows}_${col+cols}`;result.push(`<clipPath id="${id}" clipPathUnits="userSpaceOnUse"><rect x="${N(x)}" y="${N(y)}" width="${g}" height="${g}"/></clipPath>`);cells.push({row,col,x,y,id})}}result.push('</defs>');let strings=txt.split(/\r?\n/),fontSize=vals.size*($('mode').value==='sentence'?.6:1),family=esc(font);let count=0;for(let {row,col,x,y,id} of cells){let dist=Math.hypot(col,row),boxId=(col+row)*.7,t=phase;let mx=vals.motion*(Math.sin(t*.75+boxId*2.3)*1.2+Math.sin(t*1.7+boxId*4.1)*.8+Math.sin(t*.3+boxId*1.1)*.6)*.75;let my=vals.motion*(Math.cos(t*.8+boxId*1.7)*.9+Math.cos(t*1.4+boxId*3.5)*.7+Math.cos(t*.4+boxId*2)*.6)*.75;let shx=col*vals.x,shy=row*vals.y;let stretch=Math.max(0,Math.abs(vals.squeeze)*.02*(6-Math.abs(row))/6),sy=1+Math.sign(vals.squeeze)*stretch;if(vals.compression)sy*=Math.max(.1,1-dist*vals.compression*.015);let angle=dist*vals.rotation*.8,px=x+g/2,py=y+g/2;result.push(`<g clip-path="url(#${id})">`);result.push(`<g transform="translate(${N(px)} ${N(py)}) rotate(${N(angle)}) scale(1 ${N(sy)}) translate(${N(-px)} ${N(-py)})">`);let xx=cx+shx+mx, yy=cy+shy+my;let lineHeight=fontSize*1.1;let anchor=$('mode').value==='word'?'middle':'start';if(anchor==='start')xx=cx-fontSize*1.25+shx+mx;strings.forEach((line,i)=>{let ly=yy+(i-(strings.length-1)/2)*lineHeight;result.push(`<text x="${N(xx)}" y="${N(ly)}" fill="${ink}" font-family="${family}" font-size="${N(fontSize)}" font-weight="900" text-anchor="${anchor}" dominant-baseline="central" xml:space="preserve">${esc(line||' ')}</text>`)});result.push('</g></g>');if($('showgrid').checked)result.push(`<rect x="${N(x)}" y="${N(y)}" width="${g}" height="${g}" stroke="${ink}" stroke-width="0.75" fill="none"/>`);count++}result.push('</svg>');$('status').textContent=`${W} × ${H} · ${count} ${tr('cells')} · ${tr('vector')}`;return result.join('')}
function render(){$('mount').innerHTML=makeSVG();$('mount').style.aspectRatio=`${Math.max(200,Number($('width').value)||1200)}/${Math.max(200,Number($('height').value)||1200)}`}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}$('svg').onclick=()=>download(new Blob([makeSVG()],{type:'image/svg+xml;charset=utf-8'}),'pattern-vector.svg');$('png').onclick=()=>{const svg=makeSVG(),W=Number($('width').value)||1200,H=Number($('height').value)||1200,blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{if(b)download(b,'pattern-vector.png');URL.revokeObjectURL(url)},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);alert(tr('pngError'))};img.src=url};$('pause').onclick=()=>{running=!running;last=0;$('pause').textContent=running?tr('pause'):tr('play');if(running)requestAnimationFrame(tick)};function tick(ts){if(!running)return;if(last)phase+=Math.min(.1,(ts-last)/1000)*vals.speed;last=ts;if(ts-renderFrame>32){renderFrame=ts;render()}requestAnimationFrame(tick)}$('random').onclick=()=>{for(const [id,,min,max] of defs){if(id==='speed'||id==='size')continue;vals[id]=Math.round(min+Math.random()*(max-min));$(id).value=vals[id];$('o_'+id).textContent=vals[id]}render()};$('reset').onclick=()=>{for(const [id,,,initial] of defs){vals[id]=initial;$(id).value=initial;$('o_'+id).textContent=initial}phase=0;render()};for(const id of ['txt','mode','font','width','height','showgrid','transparent','ink','paper'])$(id).addEventListener('input',render);
$('fontupload').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();const fmt={ttf:'truetype',otf:'opentype',woff:'woff',woff2:'woff2'}[ext];if(!fmt){alert(tr('fontError'));return}try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});const name='ImportedPatternFont';customFontCSS=`@font-face{font-family:'${name}';src:url('${data}') format('${fmt}');font-style:normal;font-weight:100 900;}`;let opt=Array.from($('font').options).find(o=>o.value===name);if(!opt){opt=new Option(tr('custom')+' · '+file.name,name);$('font').add(opt)}else opt.textContent=tr('custom')+' · '+file.name;$('font').value=name;$('fontnotice').textContent=tr('loaded')+'：'+file.name+'（'+tr('embedded')+'）';render()}catch(err){alert(tr('loadError')+'：'+err.message)}});
$('pdf').onclick=()=>{const svg=makeSVG();const W=Math.max(200,Math.min(8000,Number($('width').value)||1200)),H=Math.max(200,Math.min(8000,Number($('height').value)||1200));const mmW=(W*25.4/96).toFixed(3),mmH=(H*25.4/96).toFixed(3);const doc=`<!doctype html><html><head><meta charset="utf-8"><title>Pattern Vector — PDF</title><style>@page{size:${mmW}mm ${mmH}mm;margin:0}html,body{margin:0;padding:0;width:100%;height:100%}svg{display:block;width:100%;height:100%}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>${svg}<script>window.onload=()=>{document.fonts.ready.then(()=>setTimeout(()=>window.print(),300))};<\/script></body></html>`;const url=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));const w=window.open(url,'_blank');if(!w){URL.revokeObjectURL(url);alert(tr('popupError'));return}setTimeout(()=>URL.revokeObjectURL(url),120000)};
translateUI();requestAnimationFrame(tick);
</script></body></html>
